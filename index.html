<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HR &amp; GA</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#002957">
<meta name="apple-mobile-web-app-title" content="HR &amp; GA">
<meta name="application-name" content="HR &amp; GA">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" href="/apple-touch-icon.png?v=4">
<style>
:root{--bg:#F3F6FA;--card:#fff;--tx:#0B1B2E;--mut:#5B6B7F;--pri:#0665CF;--line:#E3E9F1}
@media (prefers-color-scheme:dark){:root{--bg:#071526;--card:#0E2238;--tx:#EAF1F9;--mut:#9FB2C8;--line:#1D3550}
.mark [fill="#002957"]{fill:#fff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:16px}
.card{background:var(--card);border-radius:24px;padding:34px 24px;max-width:400px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,41,87,.12)}
.mark{width:84px;height:auto}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:16px 0 4px}
.sub{color:var(--mut);margin:0 0 22px;font-size:14px}
a.btn{display:block;background:var(--pri);color:#fff;text-decoration:none;font-weight:700;padding:15px;border-radius:14px;font-size:17px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pri);margin:0 3px;animation:b 1s infinite alternate}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes b{to{opacity:.2}}
ol{text-align:left;margin:0 0 22px;padding:0;list-style:none;counter-reset:s}
ol li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
ol li:last-child{border-bottom:1px solid var(--line)}
ol li:before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px}
[hidden]{display:none!important}
.tip{color:var(--mut);font-size:13px;margin:16px 0 0}
</style>
</head><body>
<main class="card">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 6 50 57" class="mark" role="img" aria-label="PT. Hexa Tunggal Jaya">
<polygon fill="#002957" points="20,9 1,20.5 1,48.5 20,59.5 20,53.5 6.5,45.5 6.5,23.5 15,18.5 15,43.5 20,46.5 20,36 31,36 31,30 20,30"/>
<polygon fill="#0665CF" points="36,15.5 45,20.5 45,48.5 25.5,59.5 25,59.2 25,36 31,36 31,50.5 39.5,45.5 39.5,23.5 36,21.5"/>
<polygon fill="#002957" points="25,15 31,18 31,25 25,25"/>
<polygon fill="#0665CF" points="25,9 31,12.5 31,18 25,15"/>
</svg>
<h1>Divisi HR &amp; GA</h1>

<div id="buka">
<p class="sub">Membuka Aplikasi <span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
<a class="btn" id="btn1" href="#">Buka Aplikasi HR &amp; GA</a>
</div>

<div id="pasang" hidden>
<p class="sub">Aplikasi Divisi HR &amp; GA PT. Hexa Tunggal Jaya</p>
<a class="btn" id="btn2" href="#">Buka Aplikasi</a>
<p class="tip">Simpan Di Layar Utama: Ketuk <b>Bagikan</b> Lalu <b>Tambah Ke Layar Utama</b></p>
</div>
</main>
<script>
var APP = "https://script.google.com/macros/s/AKfycbz-5XFskDHYoVNmUjreOByWcNSNm4WwjvLsMzcwc9c8XDmrkdjAwyRenEVQ6RuwxBHl0w/exec";
document.getElementById('btn1').href = APP;
document.getElementById('btn2').href = APP;
var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var dariIkon = /[?&]app\b/.test(location.search) || navigator.standalone;
if (ios && !dariIkon) {
  /* iPhone/iPad di Safari: tidak langsung dialihkan supaya bisa disimpan ke Layar Utama dengan logo HR & GA.
     Alamat diberi penanda tersembunyi supaya ikon di Layar Utama langsung masuk aplikasi. */
  document.getElementById('buka').hidden = true;
  document.getElementById('pasang').hidden = false;
  try { history.replaceState(null, '', '/?app'); } catch (e) {}
} else {
  setTimeout(function () { location.replace(APP); }, dariIkon ? 0 : 600);
}
</script>
</body></html>
